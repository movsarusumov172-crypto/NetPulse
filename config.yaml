# Конфигурация NetPulse. Секреты (токен Telegram) лежат в .env, а не здесь.

interval: 30              # секунд между проверками каждой цели
timeout: 10               # секунд до прерывания одной попытки проверки
concurrency: 10           # максимум одновременных проверок
retries: 3                # дополнительных попыток до признания цели упавшей
retry_base_delay: 1       # секунд; удваивается с каждым повтором (1с, 2с, 4с, ...)
ssl_expiry_warn_days: 14  # HTTPS-цель считается упавшей, если сертификат истекает раньше

database: netpulse.db     # относительно рабочей директории (в Docker это /data)
metrics_host: 0.0.0.0     # 127.0.0.1 — только локально; в Docker нужен 0.0.0.0
metrics_port: 9100

targets:
  - name: Example website
    type: http
    url: https://example.com
    expected_status: 200

  - name: Cloudflare DNS (TCP)
    type: tcp
    host: 1.1.1.1
    port: 53

  - name: example.com DNS
    type: dns
    host: example.com
